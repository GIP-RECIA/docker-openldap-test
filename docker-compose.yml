services:
  openldap:
    build:
      context: .docker
      dockerfile: ldap/Dockerfile
    container_name: openldap-test
    init: true
    ports:
      - 389:389
      - 636:636
    environment:
      #- 'LANG=fr_FR.UTF-8'
      #- 'LC_ALL=fr_FR.UTF-8'
      - 'LDAP_BACKEND=mdb'
      - 'LDAP_ORGANISATION="GIP RECIA"'
      - 'LDAP_DOMAIN=esco-centre.fr'
      - 'LDAP_BASE_DN=dc=esco-centre,dc=fr'
      #- 'LDAP_LOG_LEVEL=-1'
      - 'LDAP_ADMIN_PASSWORD=admin'
      - 'LDAP_READONLY_USER="false"'
    volumes:
      #- /srv/docker/openldap/container/data:/var/lib/ldap
      - ldap-data:/var/lib/ldap:rw
      #- /srv/docker/openldap/container/config:/etc/ldap/slapd.d
      - ldap-config:/etc/ldap/slapd.d:rw
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost -b '' -s base >/dev/null 2>&1"]
      interval: 2s
      timeout: 2s
      retries: 15
  schema-status:
    build:
      context: .docker
      dockerfile: ldap/Dockerfile
    entrypoint: ["/usr/local/bin/check-schema-revision"]
    depends_on:
      openldap:
        condition: service_started
    volumes:
      - ${SCHEMA_REFERENCE_DIR:-.}:/schema-reference:ro
    profiles: ["schema-check"]
    restart: "no"
#  phpldapadmin:
#    image: osixia/phpldapadmin:latest
#    container_name: phpldapadmin
#    environment:
#      PHPLDAPADMIN_LDAP_HOSTS: "openldap"
#      PHPLDAPADMIN_HTTPS: "false"
#    ports:
#      - "8080:80"
#    depends_on:
#      - openldap
volumes:
  ldap-data: null
  ldap-config: null
